<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101316">
  <title>{% block title %}MDev Panel{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ asset_v }}">
</head>
<body class="page-{{ page }}">
  <header class="topbar">
    <div class="topbar-row">
      <a class="brand" href="{{ url_for('instances_page') }}">MDev Panel</a>
      {% if instance %}
        <a class="back" href="{{ url_for('instances_page') }}">← Instances</a>
      {% else %}
        <a class="tab{% if page in ('playit', 'playit-logs') %} active{% endif %}" href="{{ url_for('playit_page') }}">🌐 Playit</a>
      {% endif %}
    </div>
    {% if instance %}
      <div class="topbar-row topbar-row-2">
        <span class="instance-tag">Instance: <strong>{{ instance }}</strong></span>
        <nav class="tabs" aria-label="Instance">
          <a class="tab{% if page == 'dashboard' %} active{% endif %}" href="{{ url_for('dashboard', name=instance) }}">🏠 Dashboard</a>
          <a class="tab{% if page == 'console' %} active{% endif %}" href="{{ url_for('console_page', name=instance) }}">🖥 Console</a>
          <a class="tab{% if page == 'settings' %} active{% endif %}" href="{{ url_for('settings_page', name=instance) }}">⚙ Settings</a>
        </nav>
      </div>
    {% endif %}
  </header>

  <main class="main">
    {% block content %}{% endblock %}
  </main>

  <div id="toasts" aria-live="polite"></div>

  <script>
  /* Shared helpers: MDev.api(), MDev.toast(), MDev.copy() */
  window.MDev = (function () {
    'use strict';

    function toast(message, kind, ms) {
      var box = document.getElementById('toasts');
      var el = document.createElement('div');
      el.className = 'toast toast-' + (kind || 'info');
      el.setAttribute('role', 'status');
      el.textContent = message;
      box.appendChild(el);
      while (box.children.length > 3) { box.removeChild(box.firstChild); }
      setTimeout(function () {
        el.classList.add('out');
        setTimeout(function () { if (el.parentNode) { el.parentNode.removeChild(el); } }, 250);
      }, ms || (kind === 'error' ? 5000 : 3200));
    }

    async function api(path, opts) {
      opts = opts || {};
      var headers = { 'X-Requested-With': 'MDevPanel' };
      var body = opts.body;
      if (body && typeof body !== 'string') {
        body = JSON.stringify(body);
        headers['Content-Type'] = 'application/json';
      }
      try {
        var res = await fetch(path, { method: opts.method || 'GET', headers: headers, body: body, cache: 'no-store' });
        var data = null;
        try { data = await res.json(); } catch (e) { /* not JSON */ }
        if (!data) { data = { ok: false, message: 'Unexpected response from the panel.' }; }
        if (data.ok === undefined) { data.ok = res.ok; }
        data.httpStatus = res.status;
        return data;
      } catch (e) {
        return { ok: false, unreachable: true, message: 'Cannot reach the panel. Is it still running?' };
      }
    }

    /* navigator.clipboard only works on https/localhost; the panel is plain http on the LAN,
       so fall back to a hidden textarea + execCommand. */
    function copy(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return legacy(text); });
      }
      return Promise.resolve(legacy(text));
    }

    function legacy(text) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      return ok;
    }

    return { toast: toast, api: api, copy: copy };
  })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
